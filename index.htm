<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechDesign - Portal Responsivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero">
        <h1>TechDesign</h1>
        <p>Interfaces modernas, reutilizáveis e responsivas</p>
    </header>

    <main class="container">

        <!-- Botão -->
        <section class="section">
            <h2>Botão Personalizado</h2>
            <button class="button">Comprar Agora</button>
        </section>

        <!-- Cartão de Produto -->
        <section class="section">
            <h2>Cartão de Produto</h2>

            <div class="card">
                <img
                    src="images.jpg" alt="Produto"
                    <h2>produto</h2>
                   <p>descrição do produto</p>
            
                >

                <div class="card-content">
                    <h3 class="card-title">Produto X</h3>

                    <p class="card-description">
                        Produto moderno e tecnológico com design elegante,
                        desenvolvido para oferecer desempenho e qualidade.
                    </p>
                </div>
            </div>
        </section>

    </main>

</body>
</html>
